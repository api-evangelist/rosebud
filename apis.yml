name: Rosebud
description: 'Rosebud is an AI-powered journaling application for personal growth, combining
  journaling, habit-building, and emotional support in one experience. Users write or
  speak entries and receive conversational AI feedback, long-term pattern recognition,
  guided modes (including Internal Family Systems), automated weekly insight reports, and
  voice journaling, with end-to-end encryption for privacy. It is available on iOS, Android,
  and the web. Rosebud is a consumer product with no public API, SDK, or developer platform;
  it is surfaced in the API Evangelist network as a portfolio company of Bessemer Venture
  Partners, Initialized Capital, and Khosla Ventures.'
